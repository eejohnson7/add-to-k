<!DOCTYPE html>
<html>
<body>
    <div>
        Enter a list of integers separated by spaces:
        <input type="text" id="numbers" placeholder="numbers">
    </div>
    <div>
        Enter your expected sum:
        <input type="text" id="sum" placeholder="sum">
    </div>
    <button onclick="processInput()">Submit</button>
    <div id="result"></div>

    <script>
    function processInput() {
        /*
        Given a list of numbers and a number k, return whether any two numbers from the list add up to k.
        For example, given [10, 15, 3, 7] and k of 17, return true since 10 + 7 is 17.

        0, 1
        0, 2
        0, 3
        1, 2
        1, 3
        2, 3

        let numbers = [10, 15, 3, 7];
        let k = 17;
        */

        let numbers = document.getElementById('numbers').value.split(' ').map(Number);
        let k = parseInt(document.getElementById('sum').value);
        let addsToK = false;

        for (let i = 0; i < numbers.length; i++) {
            for (let j = i + 1; j < numbers.length; j++) {
                let sum = numbers[i] + numbers[j];
                if (sum === k) {
                    addsToK = true;
                    break;
                }
            }
            if (addsToK) break;
        }

        if (addsToK) {
            console.log("***TRUE***");
        } else {
            console.log("***FALSE***");
        }

        let resultElement = document.getElementById('result');
        if (addsToK) {
            resultElement.innerHTML = "<strong>TRUE</strong>";
        } else {
            resultElement.innerHTML = "<strong>FALSE</strong>";
        }
    }
    </script>

</body>
</html>
